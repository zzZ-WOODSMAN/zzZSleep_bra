<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Splash Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --p:#800ffc;
    --p2:#a855f7;
    --p-dark:#0d0518;
    --glow: rgba(128,15,252,0.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Manrope',sans-serif;}
  html,body{
    height:100%;
    background:radial-gradient(circle at 50% 30%, #1a0a2e 0%, #0d0518 55%, #060210 100%);
    overflow:hidden;
  }
  .screen{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-align:center;
  }
  .fade-black{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:50;
    animation: toBlack 2.2s ease forwards 2900ms;
  }
  @keyframes toBlack{
    from{opacity:0;}
    to{opacity:1;}
  }

  /* animated grid backdrop like a builder canvas */
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(128,15,252,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(128,15,252,0.12) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 75%);
    animation: gridMove 12s linear infinite;
  }
  @keyframes gridMove{
    0%{background-position:0 0,0 0;}
    100%{background-position:48px 48px,48px 48px;}
  }

  /* glowing orbs */
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    animation: float 8s ease-in-out infinite;
  }
  .orb1{width:340px;height:340px;background:var(--p);top:-100px;left:-80px;animation-delay:0s;}
  .orb2{width:280px;height:280px;background:var(--p2);bottom:-100px;right:-60px;animation-delay:2s;}
  .orb3{width:200px;height:200px;background:#c084fc;top:60%;left:70%;animation-delay:4s;}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-30px) scale(1.08);}
  }

  /* particles */
  .particle{
    position:absolute;
    width:4px;height:4px;
    background:#d8b4fe;
    border-radius:50%;
    box-shadow:0 0 8px 2px var(--glow);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
  }

  /* logo */
  .logo-wrap{
    position:relative;
    width:130px;height:130px;
    margin-bottom:36px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-ring{
    position:absolute;inset:0;
    border-radius:32px;
    border:2px solid transparent;
    background:linear-gradient(135deg,var(--p),var(--p2)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 6s linear infinite;
    box-shadow:0 0 40px var(--glow);
  }
  @keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  .logo-core{
    width:88px;height:88px;
    border-radius:24px;
    background:linear-gradient(145deg,var(--p),#5b0fc7);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 25px var(--glow),
      inset 0 0 20px rgba(255,255,255,0.25);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 25px var(--glow), inset 0 0 20px rgba(255,255,255,0.25);}
    50%{transform:scale(1.06);box-shadow:0 0 45px var(--glow), inset 0 0 25px rgba(255,255,255,0.35);}
  }
  .logo-core svg{width:44px;height:44px;fill:#fff;}

  /* text */
  .brand{
    font-size:36px;
    font-weight:800;
    letter-spacing:0;
    line-height:1.3;
    background:linear-gradient(90deg,#fff,#e9d5ff,var(--p2));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 3s linear infinite;
    margin-bottom:12px;
  }
  @keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
  }
  .tagline{
    font-size:16px;
    font-weight:400;
    color:#c9b8e8;
    opacity:0;
    animation: fadeUp 1s ease forwards 0.5s;
    letter-spacing:0;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* dashboard preview cards floating below */
  .cards{
    display:flex;
    gap:14px;
    margin-top:46px;
    opacity:0;
    animation: fadeUp 1s ease forwards 0.9s;
  }
  .card{
    width:64px;height:64px;
    border-radius:16px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(168,85,247,0.35);
    backdrop-filter: blur(6px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(128,15,252,0.25);
    animation: bob 3s ease-in-out infinite;
  }
  .card:nth-child(2){animation-delay:0.3s;}
  .card:nth-child(3){animation-delay:0.6s;}
  .card:nth-child(4){animation-delay:0.9s;}
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  .card svg{width:26px;height:26px;stroke:#d8b4fe;fill:none;stroke-width:1.6;}

  /* loader bar */
  .loader{
    width:180px;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    margin-top:52px;
    overflow:hidden;
    opacity:0;
    animation:
      fadeUp 1s ease forwards 1.2s,
      loaderHide 0.3s ease forwards 2600ms;
  }
  .loader-fill{
    height:100%;
    width:0%;
    border-radius:4px;
    background:linear-gradient(90deg,var(--p),#e9d5ff);
    box-shadow:0 0 10px var(--glow);
    animation: loadOnce 1.4s ease-out forwards 1.2s;
  }
  @keyframes loadOnce{
    0%{width:0%;}
    100%{width:100%;}
  }
  @keyframes loaderHide{
    from{opacity:1;}
    to{opacity:0;}
  }
</style>
</head>
<body>
<div class="screen">
  <div class="grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div id="particles"></div>

  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-core">
      <svg viewBox="0 0 24 24"><path d="M4 13h5v7H4zM10 4h5v16h-5zM16 9h5v11h-5z"/></svg>
    </div>
  </div>

<div class="brand">GITIX</div>
  <div class="tagline">الطريق الأمتع لبناء تطبيقك</div>


  <div class="cards">
    <div class="card" title="GitHub"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.31 6.84 9.66.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.21-3.37-1.21-.46-1.19-1.11-1.51-1.11-1.51-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.28 9.28 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.2C22 6.58 17.52 2 12 2z"/></svg></div>
    <div class="card" title="Cloudflare"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M3 16.5c-1-2.4.4-5 3-5.3.6-3 3.2-5.2 6.3-5.2 2.6 0 4.9 1.5 6 3.8 2.4-.1 4.3 1.7 4.4 4 .1 1.4-.5 2.7-1.6 3.5"/><path d="M6 17h13"/></svg></div>
    <div class="card" title="نشر"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg></div>
    <div class="card" title="كود"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg></div>
  </div>

  <div class="loader"><div class="loader-fill"></div></div>
  <div class="fade-black"></div>
</div>

<script>
  const container = document.getElementById('particles');
  const count = 28;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='particle';
    const left = Math.random()*100;
    const delay = Math.random()*8;
    const duration = 6+Math.random()*6;
    p.style.left = left+'vw';
    p.style.bottom = '-10px';
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = delay+'s';
    container.appendChild(p);
  }
</script>
</body>
</html>
<script>
    
    setTimeout(function () { window.location.href = "home.html"; }, 4800);
</script>
</body>
</html>
