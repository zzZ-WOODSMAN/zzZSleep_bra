<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Splash Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<script>
(function(){
  var themes = {
    purple: {p:'#800ffc', p2:'#a855f7', pdark:'#0d0518', glow:'rgba(128,15,252,0.55)', bg1:'#1a0a2e', bg2:'#0d0518', bg3:'#060210', orb3:'#c084fc', particle:'#d8b4fe', core2:'#5b0fc7', text2:'#e9d5ff', text3:'#c9b8e8', cardBorder:'rgba(168,85,247,0.35)', cardShadow:'rgba(128,15,252,0.25)', grid:'rgba(128,15,252,0.12)'},
    yellow: {p:'#e0a415', p2:'#f2c14e', pdark:'#1a1206', glow:'rgba(224,164,21,0.55)', bg1:'#2e2308', bg2:'#1a1206', bg3:'#0a0705', orb3:'#f4d06f', particle:'#f7dfa5', core2:'#b8790a', text2:'#fdf1d3', text3:'#e8dcc0', cardBorder:'rgba(242,193,78,0.35)', cardShadow:'rgba(224,164,21,0.25)', grid:'rgba(224,164,21,0.12)'},
    green: {p:'#16a34a', p2:'#4ade80', pdark:'#052e13', glow:'rgba(22,163,74,0.55)', bg1:'#0b3320', bg2:'#052e13', bg3:'#031a0b', orb3:'#86efac', particle:'#bbf7d0', core2:'#0d6b34', text2:'#dcfce7', text3:'#bbe8cc', cardBorder:'rgba(74,222,128,0.35)', cardShadow:'rgba(22,163,74,0.25)', grid:'rgba(22,163,74,0.12)'},
    navy: {p:'#1d4ed8', p2:'#3b82f6', pdark:'#05102b', glow:'rgba(29,78,216,0.55)', bg1:'#0b1f4d', bg2:'#05102b', bg3:'#020a1a', orb3:'#60a5fa', particle:'#bfdbfe', core2:'#173f9e', text2:'#dbeafe', text3:'#c3d4f0', cardBorder:'rgba(59,130,246,0.35)', cardShadow:'rgba(29,78,216,0.25)', grid:'rgba(29,78,216,0.12)'},
    sky: {p:'#0ea5e9', p2:'#38bdf8', pdark:'#04283a', glow:'rgba(14,165,233,0.55)', bg1:'#083754', bg2:'#04283a', bg3:'#021621', orb3:'#7dd3fc', particle:'#bae6fd', core2:'#0b6ea8', text2:'#e0f2fe', text3:'#c3e6f7', cardBorder:'rgba(56,189,248,0.35)', cardShadow:'rgba(14,165,233,0.25)', grid:'rgba(14,165,233,0.12)'},
    silver: {p:'#9ca3af', p2:'#e5e7eb', pdark:'#111214', glow:'rgba(156,163,175,0.45)', bg1:'#26282b', bg2:'#111214', bg3:'#08090a', orb3:'#d1d5db', particle:'#f3f4f6', core2:'#6b7280', text2:'#f9fafb', text3:'#d1d5db', cardBorder:'rgba(229,231,235,0.3)', cardShadow:'rgba(156,163,175,0.2)', grid:'rgba(156,163,175,0.12)'},
    teal: {p:'#0d9488', p2:'#2dd4bf', pdark:'#042925', glow:'rgba(13,148,136,0.55)', bg1:'#0a3d36', bg2:'#042925', bg3:'#021613', orb3:'#5eead4', particle:'#99f6e4', core2:'#0a6359', text2:'#ccfbf1', text3:'#a9e2da', cardBorder:'rgba(45,212,191,0.35)', cardShadow:'rgba(13,148,136,0.25)', grid:'rgba(13,148,136,0.12)'},
    gold: {p:'#d4af37', p2:'#f5d576', pdark:'#241c05', glow:'rgba(212,175,55,0.55)', bg1:'#3a2e0a', bg2:'#241c05', bg3:'#120e02', orb3:'#f0dc93', particle:'#f9ecc2', core2:'#a1791f', text2:'#fdf6df', text3:'#ecd9a3', cardBorder:'rgba(245,213,118,0.35)', cardShadow:'rgba(212,175,55,0.25)', grid:'rgba(212,175,55,0.12)'},
    monochrome: {p:'#ffffff', p2:'#cccccc', pdark:'#000000', glow:'rgba(255,255,255,0.35)', bg1:'#1a1a1a', bg2:'#000000', bg3:'#000000', orb3:'#999999', particle:'#e5e5e5', core2:'#4d4d4d', text2:'#f2f2f2', text3:'#cccccc', cardBorder:'rgba(255,255,255,0.25)', cardShadow:'rgba(255,255,255,0.15)', grid:'rgba(255,255,255,0.08)'}
  };
  var keys = Object.keys(themes);
  var chosen = themes[keys[Math.floor(Math.random()*keys.length)]];
  var root = document.documentElement.style;
  root.setProperty('--p', chosen.p);
  root.setProperty('--p2', chosen.p2);
  root.setProperty('--p-dark', chosen.pdark);
  root.setProperty('--glow', chosen.glow);
  root.setProperty('--bg1', chosen.bg1);
  root.setProperty('--bg2', chosen.bg2);
  root.setProperty('--bg3', chosen.bg3);
  root.setProperty('--orb3', chosen.orb3);
  root.setProperty('--particle', chosen.particle);
  root.setProperty('--core2', chosen.core2);
  root.setProperty('--text2', chosen.text2);
  root.setProperty('--text3', chosen.text3);
  root.setProperty('--card-border', chosen.cardBorder);
  root.setProperty('--card-shadow', chosen.cardShadow);
  root.setProperty('--grid-line', chosen.grid);
})();
</script>
<style>
  :root{
    --p:#e0a415;
    --p2:#f2c14e;
    --p-dark:#1a1206;
    --glow: rgba(224,164,21,0.55);
    --bg1:#2e2308;
    --bg2:#1a1206;
    --bg3:#0a0705;
    --orb3:#f4d06f;
    --particle:#f7dfa5;
    --core2:#b8790a;
    --text2:#fdf1d3;
    --text3:#e8dcc0;
    --card-border: rgba(242,193,78,0.35);
    --card-shadow: rgba(224,164,21,0.25);
    --grid-line: rgba(224,164,21,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Manrope',sans-serif;}
  html,body{
    height:100%;
    background:radial-gradient(circle at 50% 30%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    overflow:hidden;
  }
  .screen{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-align:center;
  }
  .fade-black{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:50;
    animation: toBlack 2.2s ease forwards 2900ms;
  }
  @keyframes toBlack{
    from{opacity:0;}
    to{opacity:1;}
  }

  /* animated grid backdrop like a builder canvas */
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 75%);
    animation: gridMove 12s linear infinite;
  }
  @keyframes gridMove{
    0%{background-position:0 0,0 0;}
    100%{background-position:48px 48px,48px 48px;}
  }

  /* glowing orbs */
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    animation: float 8s ease-in-out infinite;
  }
  .orb1{width:340px;height:340px;background:var(--p);top:-100px;left:-80px;animation-delay:0s;}
  .orb2{width:280px;height:280px;background:var(--p2);bottom:-100px;right:-60px;animation-delay:2s;}
  .orb3{width:200px;height:200px;background:var(--orb3);top:60%;left:70%;animation-delay:4s;}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-30px) scale(1.08);}
  }

  /* particles */
  .particle{
    position:absolute;
    width:4px;height:4px;
    background:var(--particle);
    border-radius:50%;
    box-shadow:0 0 8px 2px var(--glow);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-100vh);opacity:0;}
  }

  /* logo */
  .logo-wrap{
    position:relative;
    width:130px;height:130px;
    margin-bottom:36px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-ring{
    position:absolute;inset:0;
    border-radius:32px;
    border:2px solid transparent;
    background:linear-gradient(135deg,var(--p),var(--p2)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 6s linear infinite;
    box-shadow:0 0 40px var(--glow);
  }
  @keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  .logo-core{
    width:88px;height:88px;
    border-radius:24px;
    background:linear-gradient(145deg,var(--p),var(--core2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 0 25px var(--glow),
      inset 0 0 20px rgba(255,255,255,0.25);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 25px var(--glow), inset 0 0 20px rgba(255,255,255,0.25);}
    50%{transform:scale(1.06);box-shadow:0 0 45px var(--glow), inset 0 0 25px rgba(255,255,255,0.35);}
  }
  .logo-core svg{width:44px;height:44px;fill:#fff;}

  /* text */
  .brand{
    direction:ltr;
    unicode-bidi:isolate;
    font-size:36px;
    font-weight:800;
    letter-spacing:0;
    line-height:1.3;
    background:linear-gradient(90deg,#fff,var(--text2),var(--p2));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 3s linear infinite;
    margin-bottom:12px;
  }
  @keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:200% center;}
  }
  .tagline{
    font-size:16px;
    font-weight:400;
    color:var(--text3);
    opacity:0;
    animation: fadeUp 1s ease forwards 0.5s;
    letter-spacing:0;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* dashboard preview cards floating below */
  .cards{
    display:flex;
    gap:14px;
    margin-top:46px;
    opacity:0;
    animation: fadeUp 1s ease forwards 0.9s;
  }
  .card{
    width:64px;height:64px;
    border-radius:16px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--card-border);
    backdrop-filter: blur(6px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px var(--card-shadow);
    animation: bob 3s ease-in-out infinite;
  }
  .card:nth-child(2){animation-delay:0.3s;}
  .card:nth-child(3){animation-delay:0.6s;}
  .card:nth-child(4){animation-delay:0.9s;}
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  .card svg{width:26px;height:26px;stroke:var(--particle);fill:none;stroke-width:1.6;}

  /* loader bar */
  .loader{
    width:180px;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.08);
    margin-top:52px;
    overflow:hidden;
    opacity:0;
    animation:
      fadeUp 1s ease forwards 1.2s,
      loaderHide 0.3s ease forwards 2600ms;
  }
  .loader-fill{
    height:100%;
    width:0%;
    border-radius:4px;
    background:linear-gradient(90deg,var(--p),var(--text2));
    box-shadow:0 0 10px var(--glow);
    animation: loadOnce 1.4s ease-out forwards 1.2s;
  }
  @keyframes loadOnce{
    0%{width:0%;}
    100%{width:100%;}
  }
  @keyframes loaderHide{
    from{opacity:1;}
    to{opacity:0;}
  }
</style>
</head>
<body>
<div class="screen">
  <div class="grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div id="particles"></div>

  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-core">
      <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
  </div>

<div class="brand" dir="ltr">RosTrick</div>
  <div class="tagline">الطريق الأمتع لبناء تطبيقك</div>


  <div class="cards">
    <div class="card" title="GitHub"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.31 6.84 9.66.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.21-3.37-1.21-.46-1.19-1.11-1.51-1.11-1.51-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.28 9.28 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.2C22 6.58 17.52 2 12 2z"/></svg></div>
    <div class="card" title="Cloudflare"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M3 16.5c-1-2.4.4-5 3-5.3.6-3 3.2-5.2 6.3-5.2 2.6 0 4.9 1.5 6 3.8 2.4-.1 4.3 1.7 4.4 4 .1 1.4-.5 2.7-1.6 3.5"/><path d="M6 17h13"/></svg></div>
    <div class="card" title="نشر"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg></div>
    <div class="card" title="كود"><svg viewBox="0 0 24 24" stroke-width="1.4"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg></div>
  </div>

  <div class="loader"><div class="loader-fill"></div></div>
  <div class="fade-black"></div>
</div>

<script>
  const container = document.getElementById('particles');
  const count = 28;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='particle';
    const left = Math.random()*100;
    const delay = Math.random()*8;
    const duration = 6+Math.random()*6;
    p.style.left = left+'vw';
    p.style.bottom = '-10px';
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = delay+'s';
    container.appendChild(p);
  }
</script>
</body>
</html>

<script>
    
    setTimeout(function () { window.location.href = "home.html"; }, 4800);
</script>
</body>
