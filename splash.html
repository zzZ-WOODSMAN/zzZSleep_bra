<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f6fa;font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;}
.sm-splash-title{font-size:1.4rem;color:#2c3e50;font-weight:bold;margin-bottom:14px;}
.sm-splash-dots span{display:inline-block;width:10px;height:10px;margin:0 3px;border-radius:50%;background:#18bc9c;animation:smBounce 1.2s infinite ease-in-out;}
.sm-splash-dots span:nth-child(2){animation-delay:0.15s;}
.sm-splash-dots span:nth-child(3){animation-delay:0.3s;}
@keyframes smBounce{0%,80%,100%{transform:scale(0.6);opacity:0.5;}40%{transform:scale(1);opacity:1;}}

    </style>
</head>
<body>
<div class="sm-splash-title">GITIX</div><div class="sm-splash-dots"><span></span><span></span><span></span></div>
<script>
    
    setTimeout(function () { window.location.href = "home.html"; }, 2300);
</script>
</body>
</html>
